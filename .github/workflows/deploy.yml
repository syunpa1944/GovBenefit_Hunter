name: Daily Benefit Data Auto Collector

on:
  push:
    branches:
      - main
  schedule:
    # 매일 한국 시간 밤 12시 (UTC 15:00) 정각에 자동 구동 설정
    - cron: '0 15 * * *'
  workflow_dispatch:
    # 깃허브 관리자 페이지에서 필요시 수동 강제 즉시 실행 버튼 활성화
    inputs:
      reason:
        description: 'Manual Trigger Reason'
        required: false
        default: 'Manual update check'

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl

    - name: Run Benefit Data Injector
      env:
        DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      run: |
        # 공공 API 보안키를 환경변수로 주입받아 실시간 문화/정부혜택 데이터 수집 및 병합
        python inject_data.py
        # 디렉토리 안전 강제 생성 후 복사 진행
        mkdir -p test-app/public
        cp data.js test-app/public/data.js
        cp data.json test-app/public/data.json

    - name: Commit and Push Updated Data to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json data.js test-app/public/data.json test-app/public/data.js || true
        git commit -m "auto: 매일 공공데이터 수집 자동 갱신 [skip ci]" || echo "No changes to commit"
        git push origin main || echo "Git push failed or no changes"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Build AIT Package
      env:
        AIT_ACCESS_TOKEN: ${{ secrets.AIT_ACCESS_TOKEN }}
        NODE_OPTIONS: "--max-old-space-size=4096" # 메모리 고갈 방지 힙 상향
        DEBUG: "*"
      run: |
        npm install
        node build_static.js
        echo "=== CHECKING GENERATED ASSETS IN DIST/WEB ==="
        ls -la dist/web || true
        echo "=== STARTING AIT BUILD ==="
        npx ait build 2>&1 || (echo "=== AIT BUILD FAILED ===" && exit 1)

    - name: Deploy and Upload to Toss Partner Console
      env:
        NODE_OPTIONS: "--max-old-space-size=4096" # 최종 업로드 메모리 고갈 방지
      run: |
        npx ait deploy --api-key "${{ secrets.AIT_ACCESS_TOKEN }}" --app-id 32871 --version-name $(date +'%Y%m%d')-${{ github.run_number }} --timeout 120 2>&1
